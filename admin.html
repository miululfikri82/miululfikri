<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | MI Ulul Fikri</title>
    <meta name="robots" content="noindex, nofollow">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background: var(--section-bg); }
        .admin-card { background: var(--card); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        .nav-tabs .nav-link { color: var(--text); }
    </style>
</head>

<body>

    <!-- ===== GERBANG PASSWORD ===== -->
    <div id="loginGate" class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
        <div class="admin-card" style="max-width:380px; width:100%;">
            <h4 class="fw-bold text-success mb-3 text-center"><i class="bi bi-shield-lock-fill"></i> Admin Panel</h4>
            <input type="password" id="adminPassword" class="form-control mb-3" placeholder="Masukkan password admin">
            <button class="btn btn-success w-100" onclick="cekPassword()">Masuk</button>
            <div id="loginError" class="text-danger small mt-2 text-center"></div>
        </div>
    </div>

    <!-- ===== ISI ADMIN (tersembunyi sampai password benar) ===== -->
    <div id="adminContent" class="container py-4" style="display:none;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold text-success mb-0"><i class="bi bi-speedometer2"></i> Admin Panel MI Ulul Fikri</h3>
            <a href="index.html" class="btn btn-outline-secondary btn-sm"><i class="bi bi-box-arrow-left"></i> Kembali ke Web</a>
        </div>

        <ul class="nav nav-tabs mb-4" id="adminTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="tabPpdb">Verifikasi PPDB</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="tabBerita">Kelola Berita</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="tabPengumuman">Kelola Pengumuman</button></li>
        </ul>

        <!-- ===== TAB: VERIFIKASI PPDB ===== -->
        <div id="tabPpdb" class="admin-tab">
            <div class="admin-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Daftar Pendaftar PPDB</h5>
                    <button class="btn btn-sm btn-outline-success" onclick="muatPpdb()"><i class="bi bi-arrow-clockwise"></i> Muat Ulang</button>
                </div>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Nama Siswa</th>
                                <th>Kelas/Gelombang</th>
                                <th>Nama Ortu</th>
                                <th>No. WA Ibu</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="ppdbTableBody">
                            <tr><td colspan="6" class="text-center text-muted">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ===== TAB: KELOLA BERITA ===== -->
        <div id="tabBerita" class="admin-tab" style="display:none;">
            <div class="admin-card mb-4">
                <h5 class="fw-bold mb-3">Tambah Berita Baru</h5>
                <form id="formBerita">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tanggal</label>
                            <input type="date" name="tanggal" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Judul</label>
                            <input type="text" name="judul" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Isi Berita</label>
                            <textarea name="isi" class="form-control" rows="3" required></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label">URL Gambar (opsional, upload gambar ke Google Drive/Imgur dulu lalu tempel link-nya)</label>
                            <input type="url" name="gambar_url" class="form-control" placeholder="https://...">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3"><i class="bi bi-plus-circle"></i> Tambah Berita</button>
                </form>
            </div>
            <div class="admin-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Daftar Berita</h5>
                    <button class="btn btn-sm btn-outline-success" onclick="muatBerita()"><i class="bi bi-arrow-clockwise"></i> Muat Ulang</button>
                </div>
                <div id="beritaList" class="text-muted">Memuat data...</div>
            </div>
        </div>

        <!-- ===== TAB: KELOLA PENGUMUMAN ===== -->
        <div id="tabPengumuman" class="admin-tab" style="display:none;">
            <div class="admin-card mb-4">
                <h5 class="fw-bold mb-3">Tambah Pengumuman Baru</h5>
                <form id="formPengumuman">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Tanggal</label>
                            <input type="date" name="tanggal" class="form-control" required>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Judul</label>
                            <input type="text" name="judul" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label">Isi Pengumuman</label>
                            <textarea name="isi" class="form-control" rows="3" required></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success mt-3"><i class="bi bi-plus-circle"></i> Tambah Pengumuman</button>
                </form>
            </div>
            <div class="admin-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Daftar Pengumuman</h5>
                    <button class="btn btn-sm btn-outline-success" onclick="muatPengumuman()"><i class="bi bi-arrow-clockwise"></i> Muat Ulang</button>
                </div>
                <div id="pengumumanList" class="text-muted">Memuat data...</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
